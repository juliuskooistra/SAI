name: Trigger auto deployment for bikeshop

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/bikeshop-AutoDeployTrigger-93bd5e7f-8af1-4964-8e9d-06ea7e50e838.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BIKESHOP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BIKESHOP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BIKESHOP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: bikeshop4336.azurecr.io
          registryUsername: ${{ secrets.BIKESHOP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BIKESHOP_REGISTRY_PASSWORD }}
          containerAppName: bikeshop
          resourceGroup: bikeshop-rg
          imageToBuild: bikeshop4336.azurecr.io/bikeshop:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


