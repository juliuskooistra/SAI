# demo.sai1.airs.iadsf.ch: one hostname, two containers (SPEC §10).
# nginx holds TLS; the API's path prefixes go to FastAPI, everything else to
# Streamlit. Both containers listen on 127.0.0.1 only (docker-compose.yml).
#
#   sudo cp deploy/nginx/demo.sai1.airs.iadsf.ch.conf /etc/nginx/conf.d/
#   # If nginx.conf names each site instead of including conf.d/*.conf, add
#   #     include /etc/nginx/conf.d/demo.sai1.airs.iadsf.ch.conf;
#   # to its http block, or this file is never loaded.
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then `sudo certbot --nginx -d demo.sai1.airs.iadsf.ch`, which rewrites the
# installed copy with the TLS block and the :80 redirect. After certbot, this
# file is the template and conf.d holds the live config.
#
# Adding a new API prefix in api/main.py means adding it here too.

upstream bikeshop_api {
    server 127.0.0.1:8130;
    keepalive 16;
}

upstream bikeshop_frontend {
    server 127.0.0.1:8131;
}

server {
    server_name demo.sai1.airs.iadsf.ch;
    client_max_body_size 1m;

    # FastAPI: the API's prefixes, its docs and the health check.
    location ~ ^/(auth|billing|api|staff)/ {
        proxy_pass http://bikeshop_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(docs|openapi\.json|health)$ {
        proxy_pass http://bikeshop_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Streamlit: everything else. It talks to the browser over a websocket
    # (/_stcore/stream); without the Upgrade headers and the long timeout the
    # page hangs on "Connecting...".
    location / {
        proxy_pass http://bikeshop_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    listen 80;
    listen [::]:80;
}
