# demo.sai1.airs.iadsf.ch (SPEC §10.1). nginx holds TLS and passes everything
# to FastAPI, which serves both the API and the static frontend. The container
# listens on 127.0.0.1 only (docker-compose.yml).
#
#   sudo cp deploy/nginx/demo.sai1.airs.iadsf.ch.conf /etc/nginx/conf.d/
#   # If nginx.conf names each site instead of including conf.d/*.conf, add
#   #     include /etc/nginx/conf.d/demo.sai1.airs.iadsf.ch.conf;
#   # to its http block, or this file is never loaded.
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then `sudo certbot --nginx -d demo.sai1.airs.iadsf.ch`, which rewrites the
# installed copy with the TLS block and the :80 redirect. After certbot, this
# file is the template and conf.d holds the live config.

upstream bikeshop {
    server 127.0.0.1:8130;
    keepalive 16;
}

server {
    server_name demo.sai1.airs.iadsf.ch;
    client_max_body_size 1m;

    # Metrics are for Prometheus only, which scrapes over the private
    # WireGuard link (SPEC §10.3). Never public.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://bikeshop;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
